<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Google TV Hub</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background-color: #0d0f12; color: #ffffff; font-family: system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
  #hero-bg { position: fixed; top: 0; left: 0; width: 100%; height: 65%; background-size: cover; background-position: center; transition: background-image 0.3s ease; z-index: 1; }
  #hero-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(13,15,18,0.3) 0%, rgba(13,15,18,0.95) 55%, #0d0f12 100%); z-index: 2; }
  .app-container { position: relative; z-index: 3; padding: 30px 45px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
  .top-nav { display: flex; justify-content: space-between; align-items: center; }
  .nav-tabs { display: flex; gap: 12px; }
  .tab { padding: 10px 22px; border-radius: 30px; font-size: 17px; font-weight: 600; color: #a0aab5; background: rgba(255,255,255,0.08); border: 2px solid transparent; cursor: pointer; }
  .focusable:focus { outline: none; border-color: #ffffff !important; background: #ffffff !important; color: #0d0f12 !important; transform: scale(1.07); }
  .clock { font-size: 22px; font-weight: bold; color: #e0e6ed; }
  .hero-info { margin-top: 15px; max-width: 600px; }
  .hero-badge { display: inline-block; background: #e50914; color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
  .hero-title { font-size: 36px; font-weight: 800; margin-bottom: 8px; }
  .hero-desc { font-size: 16px; color: #c5cdd6; line-height: 1.5; }
  .rows-area { display: flex; flex-direction: column; gap: 18px; }
  .row-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; color: #d1d8e0; }
  .cards-row { display: flex; gap: 18px; overflow-x: auto; padding: 10px 5px; scrollbar-width: none; }
  .cards-row::-webkit-scrollbar { display: none; }
  .card { min-width: 220px; height: 125px; border-radius: 14px; background-size: cover; background-position: center; position: relative; border: 3px solid transparent; cursor: pointer; overflow: hidden; flex-shrink: 0; }
  .card.focusable:focus { background-color: transparent !important; border-color: #ffffff !important; transform: scale(1.08); z-index: 10; }
  .card-label { position: absolute; bottom: 0; right: 0; left: 0; padding: 20px 12px 8px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-size: 15px; font-weight: bold; color: #fff; }
  #player-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #close-btn { position: absolute; top: 25px; right: 35px; z-index: 101; padding: 10px 20px; border-radius: 25px; background: rgba(255,255,255,0.25); color: #fff; border: 2px solid transparent; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
  <div id="hero-bg" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=1200&q=80');"></div>
  <div id="hero-overlay"></div>

  <div class="app-container">
    <div class="top-nav">
      <div class="nav-tabs">
        <button class="tab focusable" tabindex="0" data-row="0" data-col="0" data-title="واجهة Google TV الذكية" data-desc="تصفح القنوات المباشرة والأفلام بسرعة فائقة واستجابة كاملة للريموت واللمس." data-bg="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=1200&q=80">الرئيسية</button>
        <button class="tab focusable" tabindex="0" data-row="0" data-col="1" data-title="البث التلفزيوني المباشر" data-desc="قنوات رياضية وترفيهية بجودة عالية 4K و FHD بدون تقطيع." data-bg="https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=1200&q=80">البث المباشر</button>
        <button class="tab focusable" tabindex="0" data-row="0" data-col="2" data-title="مكتبة الأفلام والمسلسلات" data-desc="أحدث الأفلام العالمية والعربية محدثة تلقائياً." data-bg="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200&q=80">الأفلام</button>
      </div>
      <div class="clock" id="tv-clock">00:00</div>
    </div>

    <div class="hero-info">
      <span class="hero-badge">GOOGLE TV HUB • 4K</span>
      <h1 class="hero-title" id="title-display">واجهة Google TV الذكية</h1>
      <p class="hero-desc" id="desc-display">اضغط على أي بطاقة بالأسفل لتجربة تشغيل البث المباشر فوراً.</p>
    </div>

    <div class="rows-area">
      <div>
        <div class="row-title">قنوات وعروض تجريبية (اضغط للتشغيل)</div>
        <div class="cards-row">
          <div class="card focusable" tabindex="0" data-row="1" data-col="0" data-title="عرض سينمائي FHD" data-desc="بث تجريبي فائق الجودة لاختبار سلاسة المشغل الداخلي." data-bg="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200&q=80" data-stream="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80');"><div class="card-label">▶ عرض سينمائي FHD</div></div>
          <div class="card focusable" tabindex="0" data-row="1" data-col="1" data-title="قناة الطبيعة والوثائقيات" data-desc="بث مباشر تجريبي بتقنية HLS المتكيفة." data-bg="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1200&q=80" data-stream="https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&q=80');"><div class="card-label">▶ الوثائقية Live</div></div>
          <div class="card focusable" tabindex="0" data-row="1" data-col="2" data-title="قناة الرياضة والملاعب" data-desc="تغطية مباشرة للمباريات والبطولات العالمية." data-bg="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&q=80" data-stream="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" style="background-image: url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500&q=80');"><div class="card-label">▶ الرياضية 4K</div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="player-modal">
    <button id="close-btn" class="focusable" onclick="closePlayer()">✕ إغلاق المشغل</button>
    <video id="tv-video" controls autoplay></video>
  </div>

<script>
  function updateClock() {
    document.getElementById('tv-clock').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }
  setInterval(updateClock, 1000); updateClock();

  let currentRow = 1, currentCol = 0, playerOpen = false, hls = null;

  function focusItem(row, col) {
    const target = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    if (target) { currentRow = row; currentCol = col; target.focus(); updateHero(target); }
  }

  function updateHero(el) {
    if (el.getAttribute('data-title')) document.getElementById('title-display').textContent = el.getAttribute('data-title');
    if (el.getAttribute('data-desc')) document.getElementById('desc-display').textContent = el.getAttribute('data-desc');
    if (el.getAttribute('data-bg')) document.getElementById('hero-bg').style.backgroundImage = `url('${el.getAttribute('data-bg')}')`;
  }

  function playStream(url) {
    if (!url) return;
    playerOpen = true;
    document.getElementById('player-modal').style.display = 'flex';
    const video = document.getElementById('tv-video');
    document.getElementById('close-btn').focus();
    if (Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else { video.src = url; video.play(); }
  }

  function closePlayer() {
    playerOpen = false;
    document.getElementById('tv-video').pause();
    if (hls) hls.destroy();
    document.getElementById('player-modal').style.display = 'none';
    focusItem(currentRow, currentCol);
  }

  document.querySelectorAll('.focusable').forEach(el => {
    el.addEventListener('focus', () => updateHero(el));
    el.addEventListener('click', () => {
      updateHero(el);
      const stream = el.getAttribute('data-stream');
      if (stream) playStream(stream);
    });
  });

  document.addEventListener('keydown', function(e) {
    if (playerOpen) {
      if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 4) { e.preventDefault(); closePlayer(); }
      return;
    }
    if (e.key === 'ArrowLeft') { e.preventDefault(); focusItem(currentRow, currentCol + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); focusItem(currentRow, currentCol - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focusItem(currentRow - 1, 0); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); focusItem(currentRow + 1, 0); }
    else if (e.key === 'Enter') { e.preventDefault(); document.activeElement.click(); }
  });

  window.onload = () => focusItem(1, 0);
</script>
</body>
</html>
